name: Build 009 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Find Android project in all ZIP files
        shell: bash
        run: |
          echo "=== Repository ZIP files ==="

          find . -maxdepth 1 -type f -iname "*.zip" -print

          mkdir -p extracted_all

          FOUND=""

          while IFS= read -r ZIP_FILE; do

            echo "--------------------------------"
            echo "Checking ZIP:"
            echo "$ZIP_FILE"

            SAFE_NAME=$(basename "$ZIP_FILE" .zip | tr -cd '[:alnum:]_-')

            if [ -z "$SAFE_NAME" ]; then
              SAFE_NAME="zip_project"
            fi

            DEST="extracted_all/$SAFE_NAME"

            rm -rf "$DEST"
            mkdir -p "$DEST"

            unzip -o "$ZIP_FILE" -d "$DEST" >/dev/null 2>&1 || true

            SETTINGS_FILE=$(find "$DEST" -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then

              FOUND="$SETTINGS_FILE"

              echo "Android project found:"
              echo "$FOUND"

              break

            fi

          done < <(find . -maxdepth 1 -type f -iname "*.zip")

          if [ -z "$FOUND" ]; then

            echo "================================"
            echo "ERROR: Android project not found"
            echo "================================"

            echo "Extracted files:"
            find extracted_all -maxdepth 6 -type f | head -n 500

            exit 1

          fi

          AND
