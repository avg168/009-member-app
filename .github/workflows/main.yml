name: Build 009 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Find and extract ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found"
            find extracted -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Build Android APK
        shell: bash
        run: |
          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Prepare APK
        shell: bash
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -path "*/build/outputs/apk/*/*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found"
            find "$ANDROID_DIR" -type f -name "*.apk"
            exit 1
          fi

          mkdir -p output
          cp "$APK_FILE" output/009-member-app.apk

          echo "APK ready: output/009-member-app.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 009-Android-APK
          path: output/009-member-app.apk
          retention-days: 30
