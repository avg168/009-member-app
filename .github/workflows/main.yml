name: Build 009 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取得專案
        uses: actions/checkout@v4

      - name: 安裝 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安裝 Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6"

      - name: 尋找並解壓 ZIP
        shell: bash
        run: |
          echo "目前 Repository 檔案："
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 ZIP 檔案"
            exit 1
          fi

          echo "找到 ZIP：$ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "解壓完成"
          find extracted -maxdepth 3 -type f | head -n 100

      - name: 尋找 Android 專案
        shell: bash
        run: |
          ANDROID_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "找不到 Android 專案"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "找到 Android 專案：$ANDROID_DIR"

      - name: 編譯 Android APK
        shell: bash
        run: |
          cd "$ANDROID_DIR"

          echo "開始編譯 APK..."
          gradle assembleDebug --no-daemon

      - name: 尋找 APK
        shell: bash
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "找不到 APK"
            exit 1
          fi

          echo "找到 APK：$APK_FILE"

          mkdir -p output
          cp "$APK_FILE" output/009-member-app.apk

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: 009-Android-APK
          path: output/009-member-app.apk
          retention-days: 30
