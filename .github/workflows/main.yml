name: Build 009 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Find Android project in ZIP files
        shell: bash
        run: |
          echo "=== Repository ZIP files ==="
          find . -maxdepth 1 -type f -name "*.zip" -print

          rm -rf extracted
          mkdir -p extracted

          FOUND=""

          while IFS= read -r ZIP_FILE
          do
            echo "--------------------------------"
            echo "Checking ZIP: $ZIP_FILE"

            TEMP_DIR="extracted/check"
            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            unzip -q -o "$ZIP_FILE" -d "$TEMP_DIR"

            SETTINGS_FILE=$(find "$TEMP_DIR" -type f -name "settings.gradle" -print -quit)

            if [ -z "$SETTINGS_FILE" ]; then
              SETTINGS_FILE=$(find "$TEMP_DIR" -type f -name "settings.gradle.kts" -print -quit)
            fi

            if [ -n "$SETTINGS_FILE" ]; then
              ANDROID_DIR=$(dirname "$SETTINGS_FILE")

              echo "Android project found:"
              echo "$ANDROID_DIR"

              echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

              FOUND="yes"
              break
            fi

          done < <(find . -maxdepth 1 -type f -name "*.zip" -print)

          if [ -z "$FOUND" ]; then
            echo "Android project not found."
            exit 1
          fi

      - name: Build Android APK
        shell: bash
        run: |
          echo "Android directory:"
          echo "$ANDROID_DIR"

         
